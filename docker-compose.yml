# Only infrastructure runs in Docker. Bot and worker run on the host with uv
# (Docker on macOS cannot use the Apple GPU).
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: reels
      POSTGRES_PASSWORD: reels
      POSTGRES_DB: reels
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first start with an empty volume: creates the test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reels -d reels"]
      interval: 5s
      timeout: 3s
      retries: 10

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      # Any value enables --local: no 20 MB download limit, files are served from disk.
      TELEGRAM_LOCAL: "1"
    ports:
      - "127.0.0.1:${TELEGRAM_API_PORT:-8081}:8081"
    volumes:
      # Must match TELEGRAM_FILES_CONTAINER_PATH -> TELEGRAM_FILES_HOST_PATH in .env
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api

volumes:
  pgdata:
