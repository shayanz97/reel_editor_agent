<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "CoverFont";
    src: url("$font_url");
    font-weight: 100 900;
  }
  html, body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #000;
  }
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Darkens the middle band so the headline stays readable on any frame. */
  .shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.55) 50%, rgba(0,0,0,.55) 68%, rgba(0,0,0,0) 85%);
  }
  /* Instagram's profile grid shows the centre 3:4 (y 240-1680): keep the headline inside. */
  .title {
    position: absolute;
    left: 80px;
    right: 80px;
    top: 900px;
    max-height: 640px;
    font-family: "CoverFont", sans-serif;
    font-weight: 800;
    font-size: 112px;
    line-height: 1.05;
    color: $text_color;
    text-align: center;
    text-transform: uppercase;
    text-shadow: 0 6px 24px rgba(0,0,0,.6);
    overflow-wrap: break-word;
    hyphens: auto;
  }
  .bar {
    display: block;
    width: 220px;
    height: 14px;
    margin: 36px auto 0;
    background: $accent_color;
    border-radius: 7px;
  }
</style>
</head>
<body>
  <img class="frame" src="$frame_url" alt="">
  <div class="shade"></div>
  <div class="title" id="title">$headline<span class="bar"></span></div>
  <script>
    // Long headlines: shrink until they fit into the safe area.
    document.fonts.ready.then(() => {
      const t = document.getElementById("title");
      let size = 112;
      while (t.scrollHeight > 640 && size > 48) {
        size -= 4;
        t.style.fontSize = size + "px";
      }
      document.body.dataset.ready = "1";
    });
  </script>
</body>
</html>
