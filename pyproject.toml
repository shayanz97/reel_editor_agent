[project]
name = "reels"
version = "0.1.0"
description = "Reels-Automatisierung: Telegram-Video rein, geschnittenes Reel mit Untertiteln raus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.13",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "opencv-python-headless>=4.10,<5",
    "pgvector>=0.5.1",
    "playwright>=1.64.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "silero-vad>=6.2.3",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "whisperx>=3.8.6",
]

[project.optional-dependencies]
# Apple-GPU transcription, only installable on macOS arm64: `uv sync --extra mac`
mac = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
reels = "reels.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reels"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Leave the project docs (CLAUDE.md, TASKS.md) exactly as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
# German customer texts use typographic quotes and dashes on purpose.
allowed-confusables = ["„", "“", "–", "’"]

[tool.ruff.lint.isort]
known-first-party = ["reels", "tests"]

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true

# domain/ is pure logic and gets the full strict treatment
# (`strict = true` cannot be set per module, so the flags are listed).
[[tool.mypy.overrides]]
module = ["reels.domain", "reels.domain.*"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
warn_return_any = true
implicit_reexport = false

# Third-party packages without type information.
[[tool.mypy.overrides]]
module = ["whisperx", "mlx_whisper", "silero_vad", "pgvector", "pgvector.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs FFmpeg or the Postgres from docker compose",
]
